name: Host Tests

on:
  pull_request:
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  unit_tests:
    name: Unit tests and coverage
    runs-on: ubuntu-latest
    container:
      image: irvingywang/per-firmware:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host test dependencies
        run: |
          apt-get update
          apt-get install -y gcc g++ lcov

      - name: Build, test, and generate coverage
        env:
          CC: gcc
          CXX: g++
          CMAKE_GENERATOR: Ninja
        run: python3 per_build.py tests unit --coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: host-test-coverage
          path: firmware/build/host-tests/coverage
          if-no-files-found: error
          retention-days: 14

  publish_coverage:
    name: Publish coverage to GitHub Pages
    needs: unit_tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: github-pages
      cancel-in-progress: false

    steps:
      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: host-test-coverage
          path: coverage

      - name: Deploy coverage report
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: coverage/html
          destination_dir: coverage
          keep_files: true
